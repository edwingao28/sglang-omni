# SPDX-License-Identifier: Apache-2.0
#
# Qwen3-Omni speech pipeline with 2 replicas of one speech_tail process.
#
# Layout (3 GPUs):
#   GPU 0: thinker (single instance)
#   GPU 1: talker_ar@r0 + code2wav@r0
#   GPU 2: talker_ar@r1 + code2wav@r1
#
# Each speech_tail replica owns both talker_ar and code2wav. Admission selects
# the Process replica once and projects that index onto both member stages.
#
# Serve:
#   sgl-omni serve --config examples/configs/qwen3_omni_speech_replica2.yaml --port 8091
#
# Baseline A/B counterpart: the default speech pipeline (no --config needed),
# which runs one talker_ar + code2wav pair on GPU 1.

config_cls: Qwen3OmniSpeechProcessReplicaPipelineConfig
name: qwen3-omni-speech-replica2
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

processes:
  speech_tail:
    num_replicas: 2
    replica_devices: [1, 2]
